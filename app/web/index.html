<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="activotrade_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>activotrade_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- firebase-messaging-sw.js is not registered here; firebase_messaging registers it itself. -->

  <script>
    // A notification tap lands in firebase-messaging-sw.js, which is registered
    // under /firebase-cloud-messaging-push-scope and so never controls this
    // page — client.navigate() rejects. The worker posts the location instead
    // and this moves the tab, which go_router picks up from the hash.
    navigator.serviceWorker?.addEventListener('message', (event) => {
      const link = event.data && event.data.deepLink;
      if (!link) {
        return;
      }
      if (window.location.href === link) {
        // Same tap twice, or the tab is already showing it. Assigning an
        // unchanged href is a no-op, so there is nothing to do.
        return;
      }
      window.location.href = link;
      // A hash-only change does not reach Flutter's router: it listens for
      // popstate, which the browser does not fire for a programmatic hash
      // assignment. Reload so the app boots at the new location instead —
      // AppRouter parks that URL and opens it once the session is restored.
      window.location.reload();
    });
  </script>

</body>
</html>
