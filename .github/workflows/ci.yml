name: CI

# Every push and pull request must be formatted, analysis-clean and green.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Localizations are generated; regenerate so a stale commit cannot
      # mask a missing .arb key.
      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test
